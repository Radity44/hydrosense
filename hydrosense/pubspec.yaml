name: hydrosense
description: Sistem monitoring real-time pH dan Nutrisi hidroponik berbasis IoT.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  device_preview: ^1.3.1
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  firebase_database: ^12.3.0
  flutter:
    sdk: flutter
  # Firebase (aktifkan saat sudah siap dihubungkan)
  # firebase_core: ^2.24.0
  # firebase_auth: ^4.15.0
  # firebase_database: ^10.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

